<text x="44" y="58" class="k">01  ·  AGENT ORCHESTRATION · FLAGSHIP</text>
<text x="44" y="110" class="title">Atelier</text>
<text x="44" y="144" class="tag">From a product description to reviewed pull requests.</text>
<text x="44" y="176" class="body">An orchestration platform that turns a one-paragraph product</text><text x="44" y="202" class="body">description into requirements, tasks, code, tests and reviewed pull</text><text x="44" y="228" class="body">requests. Agents work in isolated folders, and every task is routed</text><text x="44" y="254" class="body">through one function, so a supervisor can slot in later.</text>
