  .tag{font:600 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e6edf3}
  .body{font:400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#8b949e}
  .url{font:500 12px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#8b949e}
  .mono{font:500 14px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#e6edf3}
  .stage{opacity:0;animation:stage 11s cubic-bezier(.22,1,.36,1) infinite backwards}@keyframes stage{0%{opacity:0;transform:translateX(8px)}5%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
  .tick{opacity:0;animation:tick 11s cubic-bezier(.22,1,.36,1) infinite backwards}@keyframes tick{0%{opacity:0}4%,80%{opacity:1}88%,100%{opacity:0}}
  .float{animation:floaty 7s ease-in-out infinite}@keyframes floaty{50%{transform:translateY(-6px)}}
  .pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ring{animation:ring 2s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.stage,.tick{opacity:1}.ring{opacity:0}}
</style>
