<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Atelier: flagship project</title>
<desc id="d">From a product description to reviewed pull requests. An orchestration platform that turns a one-paragraph product description into requirements, tasks, code, tests and reviewed pull requests. Agents work in isolated folders, and every task is routed through one function, so a supervisor can slot in later. Built with Python, FastAPI, OpenAI, Alembic, Next.js, Agents. Status: In development.</desc>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#16202c"/></pattern><radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 200) scale(420 260)"><stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
<style>
.k{font:600 13px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;letter-spacing:2px;fill:#22d3ee}
