<title id="t">Amir Shahzad Hashmi</title>
<desc id="d">Amir Shahzad Hashmi. I build LLM agents that ship to production. RAG pipelines with evals before release. RLHF benchmark tasks and graders. automation that replaces manual work. AI engineer · Python first · amirshahzadhashmi.com. Building for real users since 2021. Open to AI engineering roles and open source.</desc>
