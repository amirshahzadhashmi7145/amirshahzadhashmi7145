  @keyframes swap{0%{opacity:0;transform:translateY(14px)}2.81%{opacity:1;transform:none}21.88%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}
  .meta{font:500 14px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#526071;letter-spacing:.5px}
  .tag{font:400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#526071}
  .dot{fill:#1a7f37}
  .spin{transform-origin:960px 212px;animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .orbit{transform-origin:960px 212px;animation:orbit 12s linear infinite}@keyframes orbit{to{stroke-dashoffset:-100}}
  .flow{animation:flow 2.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-100}}
  .float{animation:floaty 6s ease-in-out infinite}@keyframes floaty{50%{transform:translateY(-5px)}}
  .breathe{transform-origin:960px 212px;animation:breathe 4s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.18);opacity:.6}}
  .pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.ring{animation:ring 2s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.word,.fade{opacity:1}.phrase{opacity:0}.phrase:first-of-type{opacity:1}}
</style>
