  .tiny{font:500 12px ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace;fill:#5b6673}
  .walk{animation:walk 3s linear infinite}@keyframes walk{to{stroke-dashoffset:-100}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.tile{opacity:1}.beam{opacity:0}}
</style>
