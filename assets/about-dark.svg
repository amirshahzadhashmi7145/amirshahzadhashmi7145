<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
<title id="t">About me</title>
<desc id="d">NOW · IN PRODUCTION: Agentic RAG. A hierarchical agent that answers from real documents and structured data. Retrieval routing, escalation to humans, and evals before anything ships. EVALS · RLHF: Model evaluation. Benchmark tasks and grading infrastructure used to train and test LLMs, including agentic tasks with automated graders. I CARE ABOUT: Plain Python first. No framework layer that does not earn its keep. Tests and evals before release. Automation that removes work people did by hand. OPEN TO: AI engineering roles, contracts and open source. Getting involved in open source LLM tooling. If you maintain something in that space and could use a hand, my inbox is open.</desc>
